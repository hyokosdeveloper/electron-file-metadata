<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>File Metadata Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>File Metadata Viewer</h1>

  <form>
    <div>
      <label for="filePicker">
        <input id="filePicker" name="filepicker" type="file" multiple>
      </label>
    </div>

    <label for="formBtn">
      <button id="formBtn" type="submit">Get Metadata</button>
    </label>
  </form>

  <hr />

  <pre id="data"></pre>

  <script src="./renderer.js"></script>
</body>
</html>
